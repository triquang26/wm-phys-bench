[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "warp-score"
version = "0.1.0"
description = "Empirical hallucination scoring for robot video frames via RoMaV2 dense warp matching"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "torch>=2.0",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.scripts]
warp-score = "warp_score.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["warp_score*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
