# Conda environment for warp-score hallucination detection.
#
# NOTE: torch + CUDA must be installed separately to match your CUDA version.
# Example (CUDA 12.1):
#   conda activate warp-score
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
#
# On this machine the `groot` conda env already has the right torch/CUDA combo;
# activate it and run `pip install -e .` instead of creating this env from scratch.

name: warp-score
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - -e .
    - scipy>=1.11
    - opencv-python-headless>=4.8
    - tqdm>=4.65
    - pyyaml>=6.0
    - matplotlib>=3.7
    - scikit-learn>=1.3
    - transformers>=4.40   # for SAM3
    - Pillow>=10.0
